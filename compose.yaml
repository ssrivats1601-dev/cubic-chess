services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cubic_chess
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: cubic_chess
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cubic-chess-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubic_chess"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  cubic-chess-data:
