name: Cubic Chess checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cubic_chess
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: cubic_chess_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cubic_chess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cubic_chess:ci-only-password@127.0.0.1:5432/cubic_chess_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          if-no-files-found: ignore
